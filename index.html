<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Certificate Verification</title>
<style>
:root{--bg:#eef2ef;--card:#fff;--ink:#1b2a22;--mute:#5d6b63;--line:#d9e2dc;--ok:#1a8a3c;--okbg:#e6f5ea;--bad:#b3261e;--badbg:#fdeceb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231d;--ink:#e8f0eb;--mute:#97a79d;--line:#2a3a31;--ok:#4cc16d;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1b19}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231d;--ink:#e8f0eb;--mute:#97a79d;--line:#2a3a31;--ok:#4cc16d;--okbg:#17301f;--bad:#ff8a80;--badbg:#3a1b19}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Serif 4",Georgia,serif;min-height:100vh;display:flex;justify-content:center;padding:24px 14px}
.card{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.08);align-self:flex-start}
.top{height:8px;background:var(--ok)}
.body{padding:26px 22px 22px}
.head{text-align:center;margin-bottom:16px}
.logo{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 8px;display:block}
.inst{margin:0;font-size:18px;font-weight:700}
.seal{width:76px;height:76px;margin:6px auto 12px;display:block}
.seal .ring{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .9s ease-out .15s forwards}
.seal .tick{stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s ease-out .9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.status{margin:0 0 6px;text-align:center;font-size:22px;line-height:1.3;font-weight:700;color:var(--ok)}
.status.bad{color:var(--bad)}
.sub{margin:0 0 20px;text-align:center;font-size:15px;color:var(--mute);line-height:1.5}
.idbox{background:var(--okbg);border:1px dashed var(--ok);border-radius:10px;padding:13px;text-align:center;margin-bottom:20px}
.idbox.bad{background:var(--badbg);border-color:var(--bad)}
.idbox small{display:block;color:var(--mute);font-size:14px;margin-bottom:5px}
.idbox strong{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:.04em;word-break:break-all}
dl{margin:0 0 20px;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:16px}
dt{color:var(--mute)}dd{margin:0;text-align:right;font-weight:600}
.row{margin-bottom:18px}
.row .l{display:flex;justify-content:space-between;font-size:15px;margin-bottom:7px}
.row .l b{font-size:17px}
.track{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--ok);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .5s}
.stars{font-size:22px;letter-spacing:3px;color:#e0a100}
.rem{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:14px;font-size:16px}
.badge{background:var(--ok);color:#fff;font-weight:700;padding:6px 14px;border-radius:99px;font-size:15px}
.sign{margin-top:22px;text-align:right;font-size:15px}
.sign .name{font-family:"Brush Script MT","Segoe Script",cursive;font-size:26px;margin:0}
.sign span{color:var(--mute);font-size:13px}
.vt{margin:18px 0 0;font-size:13px;color:var(--mute);text-align:center}
.btn{display:block;margin:14px auto 0;background:none;border:1px solid var(--ok);color:var(--ok);padding:9px 20px;border-radius:99px;font:600 15px Georgia,serif;cursor:pointer}
.btn:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.hide{display:none}
@media (prefers-reduced-motion:reduce){.seal .ring,.seal .tick{animation:none;stroke-dashoffset:0}.fill{transition:none}}
@media print{.btn{display:none}body{background:#fff;padding:0}.card{box-shadow:none}}
</style>
</head>
<body>
<main class="card">
  <div class="top"></div>
  <div class="body">
    <div class="head">
      <img class="logo hide" id="logo" alt="Institute logo">
      <p class="inst" id="inst"></p>
    </div>
    <svg class="seal" id="seal" viewBox="0 0 84 84" fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle class="ring" cx="42" cy="42" r="38" stroke="var(--ok)"/>
      <path class="tick" d="M26 43l11 11 21-23" stroke="var(--ok)"/>
    </svg>
    <p class="status" id="status" role="status"></p>
    <p class="sub" id="sub"></p>
    <div class="idbox" id="idbox"><small id="idlabel"></small><strong id="uid"></strong></div>
    <div id="details">
      <dl id="dl"></dl>
      <div class="row hide" id="profRow">
        <div class="l"><span>Proficiency</span><b id="pct"></b></div>
        <div class="track"><div class="fill" id="fill"></div></div>
      </div>
      <div class="row hide" id="ratingRow"><div class="l"><span>Proficiency Level</span><b id="rt"></b></div><div class="stars" id="stars" aria-hidden="true"></div></div>
      <div class="rem hide" id="remRow"><span>Remarks</span><span class="badge" id="rem"></span></div>
      <div class="sign hide" id="sign"><p class="name" id="sigName"></p><span id="sigTitle"></span></div>
    </div>
    <p class="vt" id="vt"></p>
    <button class="btn" id="print" onclick="window.print()">Print / Save as PDF</button>
  </div>
</main>
<script>
// ---- Edit this section only ----
var INSTITUTE = { name: "", logo: "", signatory: "", signatoryTitle: "" }; // fill name / logo (data URI) / signatory
var REGISTRY = {
  "UAPTGH2739378098": {
    name: "Rahul",
    course: "",            // e.g. "Course name"
    completed: "16 October 2026",   // exam and project completion date
    validTill: "",         // e.g. "15 October 2029"
    proficiency: 89,
    rating: null,          // e.g. 4.5 (out of 5)
    remarks: "Category A student"
  },
  "QINTHGH2739458098": {
    name: "MOHD HASSAN",
    regId: "39879",
    course: "Financial Modeling",
    completed: "12 October 2026",
    validTill: "",
    proficiency: null,
    rating: 4.7,
    remarks: ""
  }
};
var DEFAULT_ID = "QINTHGH2739458098";
// --------------------------------
var $ = function(i){return document.getElementById(i)};
var id = (new URLSearchParams(location.search).get("id") || DEFAULT_ID).trim().toUpperCase();
var rec = REGISTRY[id];
$("uid").textContent = id;
if (INSTITUTE.name) $("inst").textContent = INSTITUTE.name;
if (INSTITUTE.logo) { $("logo").src = INSTITUTE.logo; $("logo").className = "logo"; }
if (rec) {
  $("status").textContent = "Verification successful.";
  $("sub").textContent = "This certificate has been duly issued by the institute and is confirmed as genuine and authentic.";
  $("idlabel").textContent = "Here is the unique ID";
  var rows = [["Student", rec.name],["Registration ID", rec.regId],["Course", rec.course],["Exam & project completed on", rec.completed],["Valid till", rec.validTill]];
  $("dl").innerHTML = rows.filter(function(r){return r[1]}).map(function(r){
    var d=document.createElement("div");d.style.display="contents";
    var t=document.createElement("dt");t.textContent=r[0];var v=document.createElement("dd");v.textContent=r[1];
    d.appendChild(t);d.appendChild(v);return d.outerHTML;}).join("");
  if (rec.proficiency) { $("pct").textContent = rec.proficiency + "%"; $("profRow").className = "row"; }
  if (rec.remarks) { $("rem").textContent = rec.remarks; $("remRow").className = "rem"; }
  if (rec.rating) {
    var full = Math.round(rec.rating);
    $("stars").textContent = "★".repeat(full) + "☆".repeat(5-full);
    $("rt").textContent = rec.rating + " / 5";
    $("ratingRow").className = "row";
  }
  if (INSTITUTE.signatory) { $("sigName").textContent = INSTITUTE.signatory; $("sigTitle").textContent = INSTITUTE.signatoryTitle || "Authorised Signatory"; $("sign").className = "sign"; }
  $("vt").textContent = "Verified on " + new Date().toLocaleString("en-IN",{dateStyle:"long",timeStyle:"short"}) + ". Scan the QR code on the certificate to verify it again.";
  if (rec.proficiency) requestAnimationFrame(function(){ $("fill").style.width = rec.proficiency + "%"; });
} else {
  $("status").textContent = "No certificate found for this ID";
  $("status").className = "status bad";
  $("sub").textContent = "Check the ID printed on the certificate or contact the institute.";
  $("idbox").className = "idbox bad";
  $("idlabel").textContent = "ID checked";
  $("details").className = "hide";
  $("print").className = "hide";
  $("seal").innerHTML = '<circle cx="42" cy="42" r="38" stroke="var(--bad)"/><path d="M29 29l26 26M55 29L29 55" stroke="var(--bad)"/>';
}
</script>
</body>
</html>
